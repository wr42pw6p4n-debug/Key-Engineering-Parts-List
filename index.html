<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Ledger</title>
<style>
  :root {
    --paper: #f7f5ef;
    --paper-line: #e4e0d4;
    --ink: #23261f;
    --ink-soft: #5b5f52;
    --moss: #3f5d4c;
    --moss-dark: #2c4235;
    --rust: #a8532f;
    --card: #ffffff;
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  }

  * { box-sizing: border-box; }

  #app-root {
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 28px 18px 60px;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .brand .titles h1 {
    font-size: 24px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
    line-height: 1.1;
  }
  .brand .titles .sub {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .masthead .count {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
    padding-left: 10px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }

  .btn-primary {
    background: var(--moss);
    color: #fff;
    padding: 10px 16px;
    font-size: 15px;
    border-radius: 3px;
  }
  .btn-primary:active { background: var(--moss-dark); }

  .btn-secondary {
    background: none;
    color: var(--moss);
    border: 1px solid var(--moss);
    padding: 9px 15px;
    font-size: 15px;
    border-radius: 3px;
    margin-left: 10px;
  }
  .btn-secondary:active { background: var(--paper-line); }

  .btn-text {
    background: none;
    color: var(--moss);
    font-size: 14px;
    padding: 4px 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .btn-danger {
    background: none;
    color: var(--rust);
    font-size: 13px;
    padding: 2px 0;
  }

  .add-customer-bar { margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: flex-start; }
  .add-customer-bar > form { flex-basis: 100%; margin-left: 0; }

  .backup-bar {
    display: flex;
    gap: 18px;
    margin-bottom: 14px;
  }
  .backup-bar .btn-text { font-size: 13px; }
  .backup-bar .btn-text:disabled { opacity: 0.4; cursor: default; text-decoration: none; }
  .import-label { cursor: pointer; }

  .sync-bar { margin-bottom: 14px; }
  .sync-note {
    font-size: 13px;
    color: var(--ink-soft);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .sync-note.connected strong { color: var(--moss-dark); font-weight: 600; }
  .sync-note strong { color: var(--rust); }
  .sync-disconnect { font-size: 12px; }

  .search-box { position: relative; margin-bottom: 14px; }
  .search-box .search-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-box input {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 10px 34px 10px 12px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background: var(--card);
    color: var(--ink);
  }
  .search-box input:focus {
    outline: 2px solid var(--moss);
    outline-offset: 1px;
  }
  .search-box .chevron {
    position: absolute;
    right: 12px;
    pointer-events: none;
    color: var(--ink-soft);
    font-size: 11px;
  }
  .search-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    box-shadow: 0 4px 14px rgba(35, 38, 31, 0.1);
    max-height: 260px;
    overflow-y: auto;
    z-index: 20;
  }
  .search-dropdown .opt {
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--paper-line);
  }
  .search-dropdown .opt:last-child { border-bottom: none; }
  .search-dropdown .opt:hover, .search-dropdown .opt.active {
    background: var(--paper);
  }
  .search-dropdown .opt .oname { font-size: 14px; }
  .search-dropdown .opt .ocompany { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .search-dropdown .no-match {
    padding: 12px;
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .customer-card.highlight {
    outline: 2px solid var(--rust);
    outline-offset: 2px;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px;
    text-transform: lowercase;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 8px 10px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: 2px solid var(--moss);
    outline-offset: 1px;
  }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }

  .form-actions { display: flex; gap: 10px; margin-top: 12px; }
  .btn-cancel {
    background: none;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 10px 6px;
  }

  .customer-card {
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    background: var(--card);
    margin-bottom: 14px;
    overflow: hidden;
  }

  .customer-head {
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }

  .customer-head .who .name { font-size: 17px; font-weight: 600; }
  .customer-head .who .company { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

  .customer-head .meta {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
  }

  .customer-body {
    border-top: 1px solid var(--paper-line);
    padding: 14px 16px 16px;
  }

  .contact-line {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }

  .materials-title {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .material-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 9px 0;
    border-bottom: 1px solid var(--paper-line);
  }
  .material-row:last-child { border-bottom: none; }

  .material-row .left .mname { font-size: 15px; }
  .material-row .left .mnotes { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .material-row .right {
    text-align: right;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
    padding-left: 10px;
  }
  .material-row .right .qty { color: var(--ink); font-size: 14px; }

  .empty-materials {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
    padding: 6px 0 10px;
  }

  .add-material-toggle { margin-top: 8px; }

  .rope-row {
    padding: 10px 0;
    border-bottom: 1px solid var(--paper-line);
  }
  .rope-row:last-child { border-bottom: none; }
  .rope-row-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .rope-row-head .rname { font-size: 15px; }
  .rope-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 14px;
    font-size: 13px;
  }
  .rope-grid > div span {
    display: block;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10px;
    color: var(--ink-soft);
    text-transform: lowercase;
  }
  .rope-notes {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
    font-style: italic;
  }

  .calc-preview {
    font-size: 13px;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px dashed var(--paper-line);
    border-radius: 3px;
    padding: 8px 10px;
    margin-top: 4px;
  }
  .calc-preview strong { color: var(--moss-dark); font-family: ui-monospace, 'SF Mono', Menlo, monospace; }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-soft);
  }
  .empty-state .big { font-size: 17px; margin-bottom: 6px; color: var(--ink); }

  .loading { text-align: center; padding: 40px; color: var(--ink-soft); }
</style>
</head>
<body>
<div id="app-root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const STORAGE_KEY = 'customers';
const FOLDER_FILE_NAME = 'key-engineering-customers.json';
const IDB_DB = 'key-eng-fs';
const IDB_STORE = 'handles';
const IDB_KEY = 'syncFolder';

function idbGet(key) {
  return new Promise((resolve) => {
    const req = indexedDB.open(IDB_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction(IDB_STORE, 'readonly');
      const getReq = tx.objectStore(IDB_STORE).get(key);
      getReq.onsuccess = () => resolve(getReq.result || null);
      getReq.onerror = () => resolve(null);
    };
    req.onerror = () => resolve(null);
  });
}

function idbSet(key, value) {
  return new Promise((resolve) => {
    const req = indexedDB.open(IDB_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    };
    req.onerror = () => resolve();
  });
}

function idbDelete(key) {
  return new Promise((resolve) => {
    const req = indexedDB.open(IDB_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    };
    req.onerror = () => resolve();
  });
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function KeyEngLogo() {
  return (
    <svg width="42" height="42" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="32" cy="32" r="31" fill="#2c4235" />
      <circle cx="32" cy="32" r="31" stroke="#a8532f" strokeWidth="1.5" />
      <g transform="translate(32,32) rotate(-40) translate(-32,-32)">
        <circle cx="24" cy="32" r="9" stroke="#f7f5ef" strokeWidth="3" fill="none" />
        <circle cx="24" cy="32" r="2.4" fill="#f7f5ef" />
        <rect x="32.5" y="30.2" width="19" height="3.6" fill="#f7f5ef" />
        <rect x="42" y="33.8" width="3.4" height="6" fill="#f7f5ef" />
        <rect x="47" y="33.8" width="3.4" height="6" fill="#f7f5ef" />
      </g>
    </svg>
  );
}

function CustomerSearch({ customers, onSelect }) {
  const [query, setQuery] = useState('');
  const [isOpen, setIsOpen] = useState(false);
  const boxRef = useRef(null);

  useEffect(() => {
    function handleClickOutside(e) {
      if (boxRef.current && !boxRef.current.contains(e.target)) setIsOpen(false);
    }
    document.addEventListener('mousedown', handleClickOutside);
    return () => document.removeEventListener('mousedown', handleClickOutside);
  }, []);

  const q = query.trim().toLowerCase();
  const matches = q
    ? customers.filter(c =>
        c.name.toLowerCase().includes(q) || (c.company || '').toLowerCase().includes(q)
      )
    : customers;

  function pick(c) {
    setQuery('');
    setIsOpen(false);
    onSelect(c.id);
  }

  if (customers.length === 0) return null;

  return (
    <div className="search-box" ref={boxRef}>
      <div className="search-input-wrap">
        <input
          value={query}
          onFocus={() => setIsOpen(true)}
          onChange={e => { setQuery(e.target.value); setIsOpen(true); }}
          placeholder="Find a customer&hellip;"
        />
        <span className="chevron">{isOpen ? '▲' : '▾'}</span>
      </div>
      {isOpen && (
        <div className="search-dropdown">
          {matches.length === 0 && <div className="no-match">No customers match "{query}"</div>}
          {matches.map(c => (
            <div className="opt" key={c.id} onClick={() => pick(c)}>
              <div className="oname">{c.name}</div>
              {c.company && <div className="ocompany">{c.company}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [customers, setCustomers] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  });
  const [showAddCustomer, setShowAddCustomer] = useState(false);
  const [showAddRope, setShowAddRope] = useState(false);
  const [expanded, setExpanded] = useState({});
  const [addingMaterialFor, setAddingMaterialFor] = useState(null);
  const [addingRopeFor, setAddingRopeFor] = useState(null);
  const [saveError, setSaveError] = useState(false);
  const [highlightId, setHighlightId] = useState(null);
  const cardRefs = useRef({});

  // OneDrive (local synced folder) integration via File System Access API
  const [folderHandle, setFolderHandle] = useState(null);
  const [folderName, setFolderName] = useState('');
  const [folderStatus, setFolderStatus] = useState('disconnected'); // disconnected | connected | needs-permission | unsupported
  const folderHandleRef = useRef(null);

  useEffect(() => {
    if (!window.showDirectoryPicker) {
      setFolderStatus('unsupported');
      return;
    }
    (async () => {
      const saved = await idbGet(IDB_KEY);
      if (!saved) return;
      folderHandleRef.current = saved;
      setFolderHandle(saved);
      setFolderName(saved.name);
      try {
        const perm = await saved.queryPermission({ mode: 'readwrite' });
        setFolderStatus(perm === 'granted' ? 'connected' : 'needs-permission');
      } catch (e) {
        setFolderStatus('needs-permission');
      }
    })();
  }, []);

  async function connectFolder() {
    try {
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      folderHandleRef.current = handle;
      setFolderHandle(handle);
      setFolderName(handle.name);
      setFolderStatus('connected');
      await idbSet(IDB_KEY, handle);
      await writeToFolder(handle, customers);
    } catch (e) {
      // user cancelled the picker — no-op
    }
  }

  async function reconnectFolder() {
    if (!folderHandleRef.current) return;
    try {
      const perm = await folderHandleRef.current.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        setFolderStatus('connected');
        await writeToFolder(folderHandleRef.current, customers);
      }
    } catch (e) {
      // ignore
    }
  }

  async function disconnectFolder() {
    folderHandleRef.current = null;
    setFolderHandle(null);
    setFolderName('');
    setFolderStatus('disconnected');
    await idbDelete(IDB_KEY);
  }

  async function writeToFolder(handle, data) {
    try {
      const fileHandle = await handle.getFileHandle(FOLDER_FILE_NAME, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(JSON.stringify(data, null, 2));
      await writable.close();
    } catch (e) {
      setFolderStatus('needs-permission');
    }
  }

  const persist = useCallback((next) => {
    setCustomers(next);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    }
    if (folderHandleRef.current && folderStatus === 'connected') {
      writeToFolder(folderHandleRef.current, next);
    }
  }, [folderStatus]);

  function addCustomer(data) {
    const next = [
      { id: uid(), ...data, materials: [], ropes: [], createdAt: Date.now() },
      ...customers,
    ];
    persist(next);
    setShowAddCustomer(false);
  }

  function deleteCustomer(id) {
    persist(customers.filter(c => c.id !== id));
  }

  function addMaterial(customerId, data) {
    const next = customers.map(c =>
      c.id === customerId
        ? { ...c, materials: [{ id: uid(), ...data, addedAt: Date.now() }, ...c.materials] }
        : c
    );
    persist(next);
    setAddingMaterialFor(null);
  }

  function deleteMaterial(customerId, materialId) {
    const next = customers.map(c =>
      c.id === customerId
        ? { ...c, materials: c.materials.filter(m => m.id !== materialId) }
        : c
    );
    persist(next);
  }

  function addRope(customerId, data) {
    const swl = parseFloat(data.swl) || 0;
    const falls = parseFloat(data.numberOfFalls) || 0;
    const reeveNumber = parseFloat(data.reeveNumber) || 0;
    const reeveLength = parseFloat(data.reeveLength) || 0;
    const extraRope = parseFloat(data.extraRope) || 0;
    const loadPerFall = falls > 0 ? swl / falls : 0;
    const totalRope = reeveNumber * reeveLength + extraRope;
    const rope = {
      id: uid(),
      ...data,
      loadPerFall: Math.round(loadPerFall * 100) / 100,
      totalRope: Math.round(totalRope * 100) / 100,
      addedAt: Date.now(),
    };
    const next = customers.map(c =>
      c.id === customerId ? { ...c, ropes: [rope, ...(c.ropes || [])] } : c
    );
    persist(next);
    return rope;
  }

  function deleteRope(customerId, ropeId) {
    const next = customers.map(c =>
      c.id === customerId
        ? { ...c, ropes: (c.ropes || []).filter(r => r.id !== ropeId) }
        : c
    );
    persist(next);
  }

  function jumpToCustomer(id) {
    setExpanded(e => ({ ...e, [id]: true }));
    setHighlightId(id);
    setTimeout(() => {
      const el = cardRefs.current[id];
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
    setTimeout(() => setHighlightId(null), 2000);
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(customers, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'key-engineering-customers-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!Array.isArray(parsed)) throw new Error('Invalid file');
        persist(parsed);
      } catch (err) {
        alert('That file could not be read as a valid backup.');
      }
    };
    reader.readAsText(file);
  }

  return (
    <div className="wrap">
      <div className="masthead">
        <div className="brand">
          <KeyEngLogo />
          <div className="titles">
            <h1>Key Engineering</h1>
            <div className="sub">CUSTOMER LEDGER</div>
          </div>
        </div>
        <span className="count">{customers.length} {customers.length === 1 ? 'record' : 'records'}</span>
      </div>

      <div className="backup-bar">
        <button className="btn-text" onClick={exportData} disabled={customers.length === 0}>
          ⬇ Export backup
        </button>
        <label className="btn-text import-label">
          ⬆ Import backup
          <input
            type="file"
            accept="application/json"
            style={{ display: 'none' }}
            onChange={(e) => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; }}
          />
        </label>
      </div>

      <div className="sync-bar">
        {folderStatus === 'unsupported' && (
          <span className="sync-note">Auto-sync to a folder isn't supported in this browser — use export/import instead.</span>
        )}
        {folderStatus === 'disconnected' && (
          <button className="btn-text" onClick={connectFolder}>☁ Connect OneDrive folder</button>
        )}
        {folderStatus === 'connected' && (
          <span className="sync-note connected">
            ☁ Syncing to <strong>{folderName}</strong>
            <button className="btn-text sync-disconnect" onClick={disconnectFolder}>disconnect</button>
          </span>
        )}
        {folderStatus === 'needs-permission' && (
          <span className="sync-note">
            ☁ Lost access to <strong>{folderName}</strong>
            <button className="btn-text" onClick={reconnectFolder}>reconnect</button>
          </span>
        )}
      </div>

      <CustomerSearch customers={customers} onSelect={jumpToCustomer} />

      <div className="add-customer-bar">
        {!showAddCustomer ? (
          <button className="btn-primary" onClick={() => setShowAddCustomer(true)}>
            + Add customer
          </button>
        ) : (
          <AddCustomerForm
            onSave={addCustomer}
            onCancel={() => setShowAddCustomer(false)}
          />
        )}
        {customers.length > 0 && !showAddRope && (
          <button className="btn-secondary" onClick={() => setShowAddRope(true)}>
            + Add rope
          </button>
        )}
        {showAddRope && (
          <AddRopeForm
            customers={customers}
            onSave={(customerId, data) => {
              addRope(customerId, data);
              setShowAddRope(false);
              jumpToCustomer(customerId);
            }}
            onCancel={() => setShowAddRope(false)}
          />
        )}
      </div>

      {saveError && (
        <div style={{ color: '#a8532f', fontSize: 13, marginBottom: 14 }}>
          Couldn't save that change. Try again in a moment.
        </div>
      )}

      {customers.length === 0 && !showAddCustomer && (
        <div className="empty-state">
          <div className="big">No customers yet</div>
          <div>Add one to start tracking their details and materials.</div>
        </div>
      )}

      {customers.map(c => (
        <CustomerCard
          key={c.id}
          customer={c}
          isOpen={!!expanded[c.id]}
          isHighlighted={highlightId === c.id}
          cardRef={(el) => { cardRefs.current[c.id] = el; }}
          onToggle={() => setExpanded(e => ({ ...e, [c.id]: !e[c.id] }))}
          onDelete={() => deleteCustomer(c.id)}
          onAddMaterial={(data) => addMaterial(c.id, data)}
          onDeleteMaterial={(mid) => deleteMaterial(c.id, mid)}
          isAddingMaterial={addingMaterialFor === c.id}
          setAddingMaterial={(v) => setAddingMaterialFor(v ? c.id : null)}
          onAddRope={(data) => addRope(c.id, data)}
          onDeleteRope={(rid) => deleteRope(c.id, rid)}
          isAddingRope={addingRopeFor === c.id}
          setAddingRope={(v) => setAddingRopeFor(v ? c.id : null)}
        />
      ))}
    </div>
  );
}

function AddCustomerForm({ onSave, onCancel }) {
  const [name, setName] = useState('');
  const [company, setCompany] = useState('');
  const [contact, setContact] = useState('');
  const [notes, setNotes] = useState('');

  function submit(e) {
    e.preventDefault();
    if (!name.trim()) return;
    onSave({ name: name.trim(), company: company.trim(), contact: contact.trim(), notes: notes.trim() });
  }

  return (
    <form className="panel" onSubmit={submit}>
      <div className="field">
        <label>customer name</label>
        <input autoFocus value={name} onChange={e => setName(e.target.value)} placeholder="Jane Whitfield" />
      </div>
      <div className="field">
        <label>company</label>
        <input value={company} onChange={e => setCompany(e.target.value)} placeholder="Whitfield Joinery" />
      </div>
      <div className="field">
        <label>contact (phone or email)</label>
        <input value={contact} onChange={e => setContact(e.target.value)} placeholder="jane@whitfieldjoinery.co" />
      </div>
      <div className="field">
        <label>notes</label>
        <textarea rows="2" value={notes} onChange={e => setNotes(e.target.value)} placeholder="Optional" />
      </div>
      <div className="form-actions">
        <button type="submit" className="btn-primary">Save customer</button>
        <button type="button" className="btn-cancel" onClick={onCancel}>Cancel</button>
      </div>
    </form>
  );
}

function CustomerCard({ customer, isOpen, isHighlighted, cardRef, onToggle, onDelete, onAddMaterial, onDeleteMaterial, isAddingMaterial, setAddingMaterial, onAddRope, onDeleteRope, isAddingRope, setAddingRope }) {
  const ropes = customer.ropes || [];
  return (
    <div className={"customer-card" + (isHighlighted ? " highlight" : "")} ref={cardRef}>
      <div className="customer-head" onClick={onToggle}>
        <div className="who">
          <div className="name">{customer.name}</div>
          {customer.company && <div className="company">{customer.company}</div>}
        </div>
        <div className="meta">
          {customer.materials.length} material{customer.materials.length === 1 ? '' : 's'} · {ropes.length} rope{ropes.length === 1 ? '' : 's'}
          <div>{isOpen ? 'close ▲' : 'open ▾'}</div>
        </div>
      </div>

      {isOpen && (
        <div className="customer-body">
          {(customer.contact || customer.notes) && (
            <div className="contact-line">
              {customer.contact}
              {customer.contact && customer.notes && ' — '}
              {customer.notes}
            </div>
          )}

          <div className="materials-title">materials used</div>

          {customer.materials.length === 0 && (
            <div className="empty-materials">Nothing logged yet.</div>
          )}

          {customer.materials.map(m => (
            <div className="material-row" key={m.id}>
              <div className="left">
                <div className="mname">{m.name}</div>
                {m.notes && <div className="mnotes">{m.notes}</div>}
              </div>
              <div className="right">
                <div className="qty">{m.qty} {m.unit}</div>
                <div>{m.date}</div>
                <button className="btn-danger" onClick={() => onDeleteMaterial(m.id)}>remove</button>
              </div>
            </div>
          ))}

          <div className="add-material-toggle">
            {!isAddingMaterial ? (
              <button className="btn-text" onClick={() => setAddingMaterial(true)}>+ Add material</button>
            ) : (
              <AddMaterialForm
                onSave={onAddMaterial}
                onCancel={() => setAddingMaterial(false)}
              />
            )}
          </div>

          <div className="materials-title" style={{ marginTop: 18 }}>ropes</div>

          {ropes.length === 0 && (
            <div className="empty-materials">Nothing logged yet.</div>
          )}

          {ropes.map(r => (
            <div className="rope-row" key={r.id}>
              <div className="rope-row-head">
                <div className="rname">{r.location || 'No location'} {r.craneNumber && `— Crane ${r.craneNumber}`}</div>
                <button className="btn-danger" onClick={() => onDeleteRope(r.id)}>remove</button>
              </div>
              <div className="rope-grid">
                <div><span>Rope size</span>{r.ropeSize || '—'} mm</div>
                <div><span>Crane details</span>{r.craneDetails || '—'}</div>
                <div><span>SWL</span>{r.swl || '—'}</div>
                <div><span>Falls</span>{r.numberOfFalls || '—'}</div>
                <div><span>Load/fall</span>{r.loadPerFall}</div>
                <div><span>Reeve</span>{r.reeveNumber || 0} × {r.reeveLength || 0}m + {r.extraRope || 0}</div>
                <div><span>Total rope</span><strong>{r.totalRope}m</strong></div>
                <div><span>Date</span>{r.date}</div>
              </div>
              {r.notes && <div className="rope-notes">{r.notes}</div>}
            </div>
          ))}

          <div className="add-material-toggle">
            {!isAddingRope ? (
              <button className="btn-text" onClick={() => setAddingRope(true)}>+ Add rope</button>
            ) : (
              <AddRopeForm
                lockedCustomerName={customer.name}
                onSave={(_, data) => { onAddRope(data); setAddingRope(false); }}
                onCancel={() => setAddingRope(false)}
              />
            )}
          </div>

          <div style={{ marginTop: 14, borderTop: '1px solid var(--paper-line)', paddingTop: 10 }}>
            <button className="btn-danger" onClick={onDelete}>Delete customer</button>
          </div>
        </div>
      )}
    </div>
  );
}

function AddMaterialForm({ onSave, onCancel }) {
  const [name, setName] = useState('');
  const [qty, setQty] = useState('');
  const [unit, setUnit] = useState('');
  const [date, setDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [notes, setNotes] = useState('');

  function submit(e) {
    e.preventDefault();
    if (!name.trim() || !qty) return;
    onSave({ name: name.trim(), qty, unit: unit.trim(), date, notes: notes.trim() });
  }

  return (
    <form className="panel" style={{ marginTop: 10 }} onSubmit={submit}>
      <div className="field">
        <label>material</label>
        <input autoFocus value={name} onChange={e => setName(e.target.value)} placeholder="Oak plywood, 18mm" />
      </div>
      <div className="row2">
        <div className="field">
          <label>quantity</label>
          <input value={qty} onChange={e => setQty(e.target.value)} placeholder="12" inputMode="decimal" />
        </div>
        <div className="field">
          <label>unit</label>
          <input value={unit} onChange={e => setUnit(e.target.value)} placeholder="sheets" />
        </div>
      </div>
      <div className="field">
        <label>date</label>
        <input type="date" value={date} onChange={e => setDate(e.target.value)} />
      </div>
      <div className="field">
        <label>notes</label>
        <textarea rows="2" value={notes} onChange={e => setNotes(e.target.value)} placeholder="Optional" />
      </div>
      <div className="form-actions">
        <button type="submit" className="btn-primary">Save material</button>
        <button type="button" className="btn-cancel" onClick={onCancel}>Cancel</button>
      </div>
    </form>
  );
}

function AddRopeForm({ customers, lockedCustomerName, onSave, onCancel }) {
  const [customerId, setCustomerId] = useState('');
  const [location, setLocation] = useState('');
  const [craneNumber, setCraneNumber] = useState('');
  const [ropeSize, setRopeSize] = useState('');
  const [craneDetails, setCraneDetails] = useState('');
  const [swl, setSwl] = useState('');
  const [numberOfFalls, setNumberOfFalls] = useState('');
  const [reeveNumber, setReeveNumber] = useState('');
  const [reeveLength, setReeveLength] = useState('');
  const [extraRope, setExtraRope] = useState('');
  const [date, setDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [notes, setNotes] = useState('');

  const swlNum = parseFloat(swl) || 0;
  const fallsNum = parseFloat(numberOfFalls) || 0;
  const loadPerFallPreview = fallsNum > 0 ? Math.round((swlNum / fallsNum) * 100) / 100 : 0;
  const reeveNumberNum = parseFloat(reeveNumber) || 0;
  const reeveLengthNum = parseFloat(reeveLength) || 0;
  const extraRopeNum = parseFloat(extraRope) || 0;
  const totalRopePreview = Math.round((reeveNumberNum * reeveLengthNum + extraRopeNum) * 100) / 100;

  function submit(e) {
    e.preventDefault();
    if (!lockedCustomerName && !customerId) return;
    if (!location.trim() && !craneNumber.trim()) return;
    onSave(customerId, {
      location: location.trim(),
      craneNumber: craneNumber.trim(),
      ropeSize: ropeSize.trim(),
      craneDetails: craneDetails.trim(),
      swl,
      numberOfFalls,
      reeveNumber,
      reeveLength,
      extraRope,
      date,
      notes: notes.trim(),
    });
  }

  return (
    <form className="panel" style={{ marginTop: 10 }} onSubmit={submit}>
      {lockedCustomerName ? (
        <div className="field">
          <label>customer</label>
          <input value={lockedCustomerName} disabled />
        </div>
      ) : (
        <div className="field">
          <label>customer</label>
          <select value={customerId} onChange={e => setCustomerId(e.target.value)}>
            <option value="">Select a customer&hellip;</option>
            {customers.map(c => (
              <option key={c.id} value={c.id}>{c.name}{c.company ? ` — ${c.company}` : ''}</option>
            ))}
          </select>
        </div>
      )}

      <div className="row2">
        <div className="field">
          <label>location</label>
          <input value={location} onChange={e => setLocation(e.target.value)} placeholder="Site / dock / yard" />
        </div>
        <div className="field">
          <label>crane number</label>
          <input value={craneNumber} onChange={e => setCraneNumber(e.target.value)} placeholder="Crane 3" />
        </div>
      </div>

      <div className="row2">
        <div className="field">
          <label>rope size (mm)</label>
          <input value={ropeSize} onChange={e => setRopeSize(e.target.value)} placeholder="20" inputMode="decimal" />
        </div>
        <div className="field">
          <label>crane details</label>
          <input value={craneDetails} onChange={e => setCraneDetails(e.target.value)} placeholder="Model / type" />
        </div>
      </div>

      <div className="row2">
        <div className="field">
          <label>SWL</label>
          <input value={swl} onChange={e => setSwl(e.target.value)} placeholder="10" inputMode="decimal" />
        </div>
        <div className="field">
          <label>number of falls</label>
          <input value={numberOfFalls} onChange={e => setNumberOfFalls(e.target.value)} placeholder="4" inputMode="decimal" />
        </div>
      </div>
      <div className="calc-preview">load per fall (ton): <strong>{loadPerFallPreview}</strong></div>

      <div className="field" style={{ marginTop: 10 }}>
        <label>drum reeve details</label>
      </div>
      <div className="row2">
        <div className="field">
          <label>number</label>
          <input value={reeveNumber} onChange={e => setReeveNumber(e.target.value)} placeholder="3" inputMode="decimal" />
        </div>
        <div className="field">
          <label>length (m)</label>
          <input value={reeveLength} onChange={e => setReeveLength(e.target.value)} placeholder="25" inputMode="decimal" />
        </div>
        <div className="field">
          <label>extra rope (m)</label>
          <input value={extraRope} onChange={e => setExtraRope(e.target.value)} placeholder="5" inputMode="decimal" />
        </div>
      </div>
      <div className="calc-preview">total rope required: <strong>{totalRopePreview}m</strong></div>

      <div className="field" style={{ marginTop: 10 }}>
        <label>date</label>
        <input type="date" value={date} onChange={e => setDate(e.target.value)} />
      </div>
      <div className="field">
        <label>notes</label>
        <textarea rows="2" value={notes} onChange={e => setNotes(e.target.value)} placeholder="Optional" />
      </div>

      <div className="form-actions">
        <button type="submit" className="btn-primary">Save rope</button>
        <button type="button" className="btn-cancel" onClick={onCancel}>Cancel</button>
      </div>
    </form>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
